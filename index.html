<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Eichhörnchenklasse — Pinnwand</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='0.9em'%20font-size='90'%3E%F0%9F%90%BF%EF%B8%8F%3C/text%3E%3C/svg%3E">

  <!-- Installierbar als App-Icon (Android/iOS) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#b1552a">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pinnwand">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand-row">
      <h1 id="brandTitle">🐿️ Eichhörnchenklasse</h1>
      <div class="brand-actions">
        <button id="searchBtn" class="icon-btn-round" type="button" title="Suchen" aria-label="Suchen">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8.7" cy="8.7" r="5.7"/><line x1="16.5" y1="16.5" x2="12.8" y2="12.8"/></svg>
        </button>
        <button id="fab" class="fab" title="Neuen Eintrag erstellen" aria-label="Neuen Eintrag erstellen">+</button>
        <button id="pushBell" class="push-bell" type="button" title="Benachrichtigungen aktivieren" aria-label="Benachrichtigungen aktivieren" hidden></button>
      </div>
    </div>
    <select id="classSelect" class="class-select" aria-label="Klasse wählen"></select>
  </div>
</header>

<main>
  <div id="notice" class="notice" hidden></div>
  <section id="feed" class="feed" aria-live="polite"></section>
  <p id="empty" class="empty" hidden></p>
</main>

<!-- Feste Fußleiste (ideen-backlog.md #17): Termin/Beteiligung/Datei
     führen direkt in die jeweilige Rubrik (ersetzt die früheren
     schwebenden Bubbles), Start in der Mitte, "Mehr" öffnet Archiv/
     Papierkorb/Version (siehe dlgMore). -->
<nav class="bottom-nav" id="viewTabs" aria-label="Navigation">
  <button data-view="dashboard" hidden>Dashboard</button>
  <!-- Nutzerwunsch 11.09.2026: Kalender und Termin sind dieselbe Rubrik
       (siehe renderKalenderView) — die Dashboard-Kachel "Kalender" ist
       weggefallen, ihr Symbol (Kalenderblatt mit Termin-Punkt) sitzt
       jetzt hier. -->
  <button class="bn-btn" data-view="termine" title="Termin" aria-label="Termin">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4.2" width="14" height="12" rx="2"/><line x1="3" y1="8" x2="17" y2="8"/><line x1="6.5" y1="2.5" x2="6.5" y2="5.5"/><line x1="13.5" y1="2.5" x2="13.5" y2="5.5"/><circle cx="7.3" cy="11.3" r=".9" fill="currentColor" stroke="none"/></svg>
    <span class="bn-label">Termin</span>
  </button>
  <button class="bn-btn" data-view="beteiligung" title="Beteiligung" aria-label="Beteiligung">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7.25"/><path d="M6.6 10.2l2.2 2.2 4.6-4.8"/></svg>
    <span class="bn-label">Beteiligung</span>
  </button>
  <!-- Nutzerwunsch 11.09.2026: Start deutlich hervorgehoben — das Icon
       sitzt in einem Kreis, der halb über die obere Kante der Fußleiste
       ragt und optisch mit deren oberem Strich verbunden ist. -->
  <button class="bn-btn bn-btn-start active" data-view="feed" title="Start" aria-label="Start">
    <span class="bn-start-spacer" aria-hidden="true"></span>
    <span class="bn-start-bump">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 9.2L10 3.5l6.8 5.7"/><path d="M4.8 8v7.5a1 1 0 0 0 1 1h8.4a1 1 0 0 0 1-1V8"/></svg>
    </span>
    <span class="bn-label">Start</span>
  </button>
  <button class="bn-btn" data-view="dateien" title="Datei" aria-label="Datei">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2.8h6l3 3v10.4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3.8a1 1 0 0 1 1-1z"/><path d="M12 2.8v3h3"/></svg>
    <span class="bn-label">Datei</span>
  </button>
  <button class="bn-btn" id="moreBtn" type="button" title="Mehr" aria-label="Mehr">
    <svg viewBox="0 0 20 20" fill="currentColor"><circle cx="4.5" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="15.5" cy="10" r="1.6"/></svg>
    <span class="bn-label">Mehr</span>
  </button>
</nav>
<button id="scrollTopBtn" class="scroll-top-btn" title="Nach oben" aria-label="Nach oben" hidden></button>

<!-- "Mehr"-Menü (ideen-backlog.md #17): Archiv, Papierkorb, Version — die
     drei seltener genutzten Ansichten, die vorher eigene Plätze in der
     Fußleiste hatten. -->
<dialog id="dlgMore" class="dlg small">
  <h2>Mehr</h2>
  <div class="more-list">
    <!-- Nur für Admins sichtbar (per JS ausgeblendet ohne Admin-Zugang,
         siehe ideen-backlog.md). -->
    <button class="more-item" id="moreArchivBtn" data-view="archiv" data-close>
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="4" width="14" height="4" rx="1"/><path d="M4.2 8v6.5a1 1 0 0 0 1 1h9.6a1 1 0 0 0 1-1V8"/><line x1="8" y1="11" x2="12" y2="11"/></svg>
      Archiv
    </button>
    <button class="more-item" id="morePapierkorbBtn" data-view="papierkorb" data-close>
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12"/><path d="M8 6V4.5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1V6"/><path d="M5.5 6l.6 9a1 1 0 0 0 1 .9h5.8a1 1 0 0 0 1-.9l.6-9"/><line x1="8.3" y1="9" x2="8.3" y2="13.5"/><line x1="11.7" y1="9" x2="11.7" y2="13.5"/></svg>
      Papierkorb
    </button>
    <button class="more-item" id="moreVersionBtn" type="button" data-close>
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7.25"/><path d="M6.6 10.2l2.2 2.2 4.6-4.8"/></svg>
      Version — was ist neu?
    </button>
    <!-- ideen-backlog.md #19: nur am Hauptlink sichtbar (per JS ausgeblendet
         bei Klassen-Link), Beschriftung/Wirkung je nach Admin-Status per JS. -->
    <button class="more-item" id="moreAdminBtn" type="button" data-close>
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="9" width="11" height="7.5" rx="1.5"/><path d="M6.5 9V6.5a3.5 3.5 0 0 1 7 0V9"/></svg>
      <span id="moreAdminBtnLabel">Admin-Zugang</span>
    </button>
  </div>
  <div class="dlg-actions">
    <button type="button" class="btn ghost" data-close>Schließen</button>
  </div>
</dialog>

<!-- Schritt 1: Was möchtest du erstellen? -->
<dialog id="dlgType" class="dlg">
  <h2>Was möchtest du erstellen?</h2>
  <div class="type-grid">
    <button data-type="hinweis"><b>Hinweis</b><span>Nachricht mit Text, Bildern & Dateien</span></button>
    <button data-type="termin"><b>Termin</b><span>Datum, Uhrzeit, Ort</span></button>
    <button data-type="liste"><b>Liste</b><span>Abhaken oder selbst eintragen</span></button>
    <button data-type="tabelle"><b>Tabelle</b><span>Eigene Spalten, wie eine Excel-Liste</span></button>
    <button data-type="umfrage"><b>Umfrage</b><span>Gemeinsam abstimmen</span></button>
    <button data-type="datei"><b>Datei</b><span>PDF oder Bild, max. 10 MB</span></button>
  </div>
  <div class="dlg-actions">
    <button class="btn ghost" data-close>Abbrechen</button>
  </div>
</dialog>

<!-- Schritt 2: Formular (Inhalt wird von app.js erzeugt) -->
<dialog id="dlgEditor" class="dlg">
  <form id="editorForm" novalidate>
    <h2 id="editorTitle">Neu</h2>
    <div id="editorFields"></div>
    <p id="editorError" class="form-error" hidden></p>
    <div class="dlg-actions">
      <button type="button" class="btn ghost" data-close>Abbrechen</button>
      <button type="submit" class="btn primary" id="editorSubmit">Speichern</button>
    </div>
  </form>
</dialog>

<!-- Bestätigung (z. B. vor dem Löschen) -->
<dialog id="dlgConfirm" class="dlg small">
  <p id="confirmText"></p>
  <div class="dlg-actions">
    <button class="btn ghost" data-answer="nein">Abbrechen</button>
    <button class="btn danger" data-answer="ja" id="confirmOk">Löschen</button>
  </div>
</dialog>

<!-- Kurze Texteingabe(n) (Name eintragen etc.) -->
<dialog id="dlgPrompt" class="dlg small">
  <form id="promptForm" novalidate>
    <h2 id="promptTitle"></h2>
    <div id="promptFields"></div>
    <div class="dlg-actions">
      <button type="button" class="btn ghost" data-close>Abbrechen</button>
      <button type="submit" class="btn primary">OK</button>
    </div>
  </form>
</dialog>

<!-- Verwaltung Kalender/Stundenplan (nur Hauptlink, ideen-backlog.md #11) —
     Inhalt wird komplett von app.js erzeugt (renderKalAdmin*). -->
<dialog id="dlgKalenderAdmin" class="dlg">
  <div id="kalAdminBody"></div>
</dialog>

<!-- Suche (ideen-backlog.md #24): durchsucht Titel/Text aller sichtbaren
     Karten, Ergebnisse nach Rubrik gruppiert, Inhalt kommt von app.js
     (renderSearchResults). -->
<dialog id="dlgSearch" class="dlg">
  <h2>Suchen</h2>
  <input type="search" id="searchInput" class="search-input" placeholder="Stichwort eingeben…" autocomplete="off">
  <div id="searchResults" class="search-results"></div>
  <div class="dlg-actions">
    <button type="button" class="btn ghost" data-close>Schließen</button>
  </div>
</dialog>

<!-- Täglicher Willkommens-Splashscreen (ideen-backlog.md #21) —
     unabhängig vom ein-/ausklappbaren Begrüßungsblock (#14). -->
<dialog id="dlgSplash" class="dlg small">
  <h2 id="splashTitle">Herzlich willkommen</h2>
  <p>Schön, dass du vorbeischaust — hier findest du alles Organisatorische rund um die Klasse.</p>
  <label class="field-checkbox">
    <input type="checkbox" id="splashHideCheckbox">
    <span>Nicht mehr anzeigen</span>
  </label>
  <div class="dlg-actions">
    <button type="button" class="btn primary" data-close>Los geht's</button>
  </div>
</dialog>

<!-- Versionshinweise: erscheint einmalig nach einem Update, oder über den Version-Button -->
<dialog id="dlgVersion" class="dlg small">
  <h2>Version</h2>
  <div id="versionList" class="version-list"></div>
  <div class="dlg-actions">
    <button type="button" class="btn primary" data-close>Alles klar</button>
  </div>
</dialog>

<div id="toast" class="toast" hidden></div>

<noscript><p class="empty">Diese Seite braucht JavaScript.</p></noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.7/purify.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {
        // Kein harter Fehler nötig — die App funktioniert auch ohne SW,
        // nur eben nicht installierbar/offline-fähig.
      });
    });
  }
</script>
</body>
</html>
